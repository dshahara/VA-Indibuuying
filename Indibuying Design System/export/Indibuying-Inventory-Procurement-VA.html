  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0:    #2BC11E;   /* hot accent */\n  --brand-green-100:    #D7F4D3;   /* tint */\n  --brand-green-50:     #ECFBEA;   /* surface tint */\n\n  /* ── Action (primary CTAs are ink, not green) ──────────── */\n  --action:             #0E1410;   /* primary button */\n  --action-pressed:     #2A332D;   /* pressed */\n  --action-disabled:    #E2E7E4;   /* disabled fill */\n  --on-action:          #FFFFFF;\n\n  /* ── Neutrals (warm-cool ink, paper-leaning) ──────────── */\n  --ink-900:            #0E1410;   /* near-black, primary fg */\n  --ink-800:            #1A211C;\n  --ink-700:            #2A332D;\n  --ink-600:            #44504A;\n  --ink-500:            #6B7770;   /* body secondary */\n  --ink-400:            #95A09A;\n  --ink-300:            #C4CCC6;\n  --ink-200:            #E2E7E4;\n  --ink-100:            #EEF1EF;\n  --ink-50:             #F6F8F6;\n  --paper:              #FFFFFF;\n  --paper-warm:         #FBFBF7;   /* off-white for large surfaces */\n\n  /* ── Semantic ─────────────────────────────────────────── */\n  --success:            #1EAF12;   /* = brand */\n  --warning:            #E8A317;   /* amber, India-warm */\n  --danger:             #D8443C;\n  --info:               #1F7AD8;\n\n  /* ── Accent (used sparingly, India-warm) ──────────────── */\n  --accent-saffron:     #F2913B;\n  --accent-clay:        #B96A4B;\n  --accent-indigo:      #1F3A5F;   /* deep, for headers/cards */\n  --accent-moss:        #1C5A4C;\n  --accent-rose:        #A8484F;\n\n  /* ── Category tints (one per sourcing category) ────────── */\n  --cat-jewellery:      #FDEBD6;   /* saffron tint */\n  --cat-jewellery-ink:  #7A4410;\n  --cat-handicrafts:    #F5E3DB;   /* clay tint */\n  --cat-handicrafts-ink:#74392A;\n  --cat-furniture:      #E3E9F2;   /* indigo tint */\n  --cat-furniture-ink:  #1F3A5F;\n  --cat-furnishings:    #DCEFE9;   /* moss tint */\n  --cat-furnishings-ink:#1C5A4C;\n  --cat-apparel:        #F7E2E4;   /* rose tint */\n  --cat-apparel-ink:    #7A2F36;\n\n  /* ── Surfaces ─────────────────────────────────────────── */\n  --bg:                 var(--paper);\n  --bg-alt:             var(--paper-warm);\n  --bg-sunken:          var(--ink-50);\n  --surface:            var(--paper);\n  --surface-2:          var(--ink-50);\n  --border:             var(--ink-200);\n  --border-strong:      var(--ink-300);\n  --hairline-soft:      var(--ink-100);\n\n  /* ── Foreground ───────────────────────────────────────── */\n  --fg-1:               var(--ink-900);   /* primary text */\n  --fg-2:               var(--ink-600);   /* secondary text */\n  --fg-3:               var(--ink-500);   /* tertiary / meta */\n  --fg-mute:            var(--ink-400);\n  --fg-onbrand:         #FFFFFF;\n  --fg-ondark:          #FFFFFF;\n  --fg-ondark-mute:     rgba(255,255,255,.66);\n\n  /* ── Type families ────────────────────────────────────── */\n  --font-display:       \"Nunito\", ui-rounded, system-ui, sans-serif;\n  --font-sans:          \"Nunito\", \"Inter\", system-ui, -apple-system, sans-serif;\n  --font-ui:            \"Inter\", \"Nunito\", system-ui, sans-serif;\n  --font-mono:          ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* ── Type scale (rem on a 16px base) ──────────────────── */\n  --fs-11: 0.6875rem; /* @kind font */\n  --fs-12: 0.75rem; /* @kind font */\n  --fs-13: 0.8125rem;\n  --fs-14: 0.875rem;\n  --fs-16: 1rem;\n  --fs-18: 1.125rem;\n  --fs-20: 1.25rem;\n  --fs-22: 1.375rem;\n  --fs-24: 1.5rem;\n  --fs-28: 1.75rem;\n  --fs-30: 1.875rem;\n  --fs-36: 2.25rem;\n  --fs-48: 3rem;\n  --fs-60: 3.75rem;\n  --fs-64: 4rem;\n  --fs-72: 4.5rem;\n  --fs-80: 5rem;\n\n  /* ── Weights ──────────────────────────────────────────── */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium:  500; /* @kind font */\n  --fw-semi:    600; /* @kind font */\n  --fw-bold:    700; /* @kind font */\n  --fw-extra:   800; /* @kind font */\n  --fw-black:   900; /* @kind font */\n\n  /* ── Line heights ─────────────────────────────────────── */\n  --lh-hero:  */\n  --dur-fast:    120ms; /* @kind other */\n  --dur-med:     200ms; /* @kind other */\n  --dur-slow:    340ms; /* @kind other */\n\n  /* ── Controls ─────────────────────────────────────────── */\n  --control-h:     44px;  /* @kind spacing */\n  --control-h-sm:  36px;  /* @kind spacing */\n\n  /* ── Layout ───────────────────────────────────────────── */\n  --container-sm:  640px;  /* @kind spacing */\n  --container-md:  860px;  /* @kind spacing */\n  --container-lg:  1120px; /* @kind spacing */\n  --container-xl:  1280px; /* @kind spacing */\n}\n\n/* ============================================================\n   Semantic type roles\n\n   Italic is a signature, not a default: it appears on the hero\n   display and stat display only. Everything below is upright.\n   ============================================================ */\n\n.h-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-black);\n  font-style: italic;\n  font-size: clamp(2.75rem, 5.2vw + .5rem, var(--fs-80));\n  line-height: var(--lh-hero);\n  letter-spacing: var(--tr-hero);\n  color: var(--fg-1);\n}\n\n.h-stat {\n  font-family: var(--font-display);\n  font-weight: var(--fw-black);\n  font-style: italic;\n  font-size: var(--fs-64);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tr-tight);\n  color: var(--fg-1);\n}\n\n.h1 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-extra);\n  font-size: clamp(2rem, 3vw + .6rem, var(--fs-48));\n  line-height: 1.08;\n  letter-spacing: var(--tr-display);\n  color: var(--fg-1);\n}\n\n.h2 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-36);\n  line-height: 1.15;\n  letter-spacing: var(--tr-tight);\n  color: var(--fg-1);\n}\n\n.h3 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-28);\n  line-height: var(--lh-snug);\n  letter-spacing: -0.01em;\n  color: var(--fg-1);\n}\n\n.h4 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-22);\n  line-height: 1.3;\n  color: var(--fg-1);\n}\n\n.h5 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-18);\n  line-height: var(--lh-normal);\n  color: var(--fg-1);\n}\n\n.eyebrow {\n  font-family: var(--font-ui);\n  font-weight: var(--fw-semi);\n  font-size: var(--fs-11);\n  letter-spacing: var(--tr-eyebrow);\n  text-transform: uppercase;\n  color: var(--brand-green-700);\n}\n\n.subtitle {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-18);\n  line-height: 1.5;\n  color: var(--fg-2);\n}\n\n.p, p {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-16);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-2);\n}\n\n.p-lead {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-20);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-1);\n}\n\n.p-small {\n  font-family: var(--font-ui);\n  font-size: var(--fs-14);\n  line-height: var(--lh-normal);\n  color: var(--fg-2);\n}\n\n.meta {\n  font-family: var(--font-ui);\n  font-size: var(--fs-13);\n  color: var(--fg-3);\n  letter-spacing: 0.01em;\n}\n\n.code, code {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n  background: var(--ink-50);\n  padding: 0.1em 0.35em;\n  border-radius: var(--r-xs);\n  color: var(--fg-1);\n}\n\n/* ============================================================\n   Base\n   ============================================================ */\n\nhtml { color-scheme: light; }\nbody {\n  font-family: var(--font-sans);\n  color: var(--fg-1);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\na { color: var(--fg-1); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }\na:hover { color: var(--brand-green-700); }\n\n\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{scroll-behavior:smooth}\nbody acing:-.025em;color:var(--brand-green-500)}\nfooter.site .blurb{font-family:var(--font-sans);font-size:14.5px;line-height:1.6;max-width:420px;margin-top:14px;color:var(--fg-ondark-mute)}\nfooter.site .legal{margin-top:24px;display:flex;justify-content:space-between;gap:16px;font-family:var(--font-ui);font-size:13px;color:rgba(255,255,255,.5)}\n\n/* ── Responsive ───────────────────────────────────── */\n@media (max-width:1023px){\n  .hero .inner{grid-template-columns:1fr;gap:36px}\n  .grid3,.team{grid-template-columns:1fr 1fr}\n  .grid4{grid-template-columns:1fr 1fr}\n  .sec{padding:64px 0}\n  .hero{padding:64px 0 56px}\n  .nav .links{display:none}\n  .banner{padding:44px 32px}\n}\n@media (max-width:639px){\n  .wrap{padding:0 20px}\n  .sec{padding:48px 0}\n  .grid2,.grid3,.grid4,.team{grid-template-columns:1fr}\n  .person{flex-direction:column;align-items:flex-start;gap:14px}\n  .banner{border-radius:var(--r-feature);padding:32px 24px}\n  footer.site .top{flex-direction:column}\n  footer.site .legal{flex-direction:column;gap:8px}\n}\n<\u002Fstyle>\n<script src=\"7f528d11-2867-432d-8523-7ba9c1f2039a\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n\n<nav class=\"nav\">\n<a class=\"lockup\" href=\"home.html\"><img src=\"98335e53-f16b-48e7-a846-1093159964cd\" alt=\"Indibuying\"><span>Indibuying<\u002Fspan><\u002Fa>\n<div class=\"links\"><a href=\"#work\">The work<\u002Fa><a href=\"#asia\">Why India<\u002Fa><a href=\"#fit\">Who it's for<\u002Fa><a href=\"#trial\">Trial<\u002Fa><a href=\"#pricing\">Pricing<\u002Fa><a href=\"#team\">Team<\u002Fa><a href=\"#faq\">FAQ<\u002Fa><\u002Fdiv>\n<div class=\"sp\"><\u002Fdiv>\n<a class=\"pill sm outline\" href=\"#call\">Book a call<\u002Fa>\n<a class=\"pill sm\" href=\"#trial\">Start the $99 trial<\u002Fa>\n<\u002Fnav>\n\n<!-- ── 1. Hero ───────────────────────────────────── -->\n<section class=\"hero\" data-screen-label=\"Hero\">\n<div class=\"wrap\"><div class=\"inner\">\n<div class=\"stack g20\">\n<div class=\"eyebrow\">Inventory &amp; procurement operations for US importers<\u002Fdiv>\n<h1 class=\"hero-h\">Inventory &amp; Procurement VA for import-led businesses<\u002Fh1>\n<p class=\"sub\">A dedicated operations assistant supports inventory reconciliation, purchase orders, receiving and billing audits, ERP updates, supplier follow-up, and inbound coordination across Asia every week.<\u002Fp>\n<div class=\"ctas\" style=\"margin-top:8px\">\n<a class=\"pill green\" href=\"#trial\">Start the $99 trial<\u002Fa>\n<a class=\"pill outline\" href=\"#call\">Book a 20-minute call<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"notpanel\">\n<div class=\"lbl\">Where to start<\u002Fdiv>\n<p class=\"body\">Start with a $99 workflow trial. Continue monthly when the workflow is proven.<\u002Fp>\n<div class=\"trust\" style=\"margin-top:8px;padding-top:16px\"><p class=\"small\">Built for US importers, wholesalers, distributors, and product businesses buying from India, China, Southeast Asia, and other overseas markets.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 2. Not a general VA ───────────────────────── -->\n<section class=\"sec tight warm\" data-screen-label=\"Not a general VA\">\n<div class=\"wrap\"><div class=\"grid2\" style=\"gap:56px;align-items:start\">\n<div class=\"stack g12\">\n<div class=\"eyebrow\">To be clear<\u002Fdiv>\n<h2 class=\"h2\">Not a general VA. Not inbox and calendar.<\u002Fh2>\n<\u002Fdiv>\n<p class=\"body\" style=\"font-size:18px;line-height:1.55\">This is for physical-product businesses that need their procurement and inventory work completed accurately, consistently, and with a clear output trail.<\u002Fp>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 3. The work ───────────────────────────────── -->\n<section class=\"sec\" id=\"work\" data-screen-label=\"The work\">\n<div class=\"wrap\">\n<div class=\"head\">\n<div class=\"eyebrow\">The work, specifically<\u002Fdiv>\n<h2 class=\"h2\">Recurring inventory and procurement work that has to be right every week.<\u002Fh2>\n<\u002Fdiv>\n<div class=\"grid3 mt40\">\n<div class=\"cardf t-green\"><h3 class=\"h3\">Inventory planning and reconciliation<\u002Fh3><p class=\"txt\">Daily or weekly inventory levels tracked across products, warehouses, and channels. Stock discrepancies, stock-out risks, excess inventory, aging inventory, slow movers, cycle count issues, and weeks of supply are flagged clearly for your team.<\u002Fp><\u002Fdiv>\n<div class=\"cardf t-green-2\"><h3 class=\"h3\">Demand and reorder support<\u002Fh3><p class=\"txt\">Historical sales, average usage, seasonality, promotions, and production plans are organized into replenishment worksheets for your team to review. The assistant prepares the numbers, keeps the tracker updated, flags stock risks, and documents suggested reorder quantities using your approved logic.<\u002Fp><\u002Fdiv>\n<div class=\"cardf t-furniture\"><h3 class=\"h3\">Purchase order and supplier timeline tracking<\u002Fh3><p class=\"txt\">Purchase orders prepared from approved templates, tracked from placement through receipt, with supplier lead times, production schedules, delayed shipments, partial orders, and delivery risks followed up proactively.<\u002Fp><\u002Fdiv>\n<div class=\"cardf t-jewellery\"><h3 class=\"h3\">Receiving and Billing Audits<\u002Fh3><p class=\"txt\">PO against receiver against packing list against vendor invoice. Customer order against shipment against invoice. This is where incorrect pricing, missing invoices, duplicate transactions, shortages, and overages usually get caught.<\u002Fp><\u002Fdiv>\n<div class=\"cardf t-furnishings\"><h3 class=\"h3\">ERP Hygiene<\u002Fh3><p class=\"txt\">Keeping your system aligned with physical stock, open POs, receivers, shipments, invoices, and vendor records, so the numbers you use to make decisions are the real ones.<\u002Fp><\u002Fdiv>\n<div class=\"cardf t-handicrafts\"><h3 class=\"h3\">Supplier Follow-Up<\u002Fh3><p class=\"txt\">Sample status, QC documents, production updates, vendor records, and inbound material readiness. Supplier communication across India, China, Southeast Asia, and other markets, with Hindi and regional-language support where useful.<\u002Fp><\u002Fdiv>\n<div class=\"cardf t-apparel span-all\"><h3 class=\"h3\">Inbound and Freight Coordination<\u002Fh3><p class=\"txt\">Pickup status, shipment milestones, clearance documents, delivery timelines, and early escalation when a production or shipment date is going to slip.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 4. Asia supplier advantage ────────────────── -->\n<section class=\"sec warm\" id=\"asia\" data-screen-label=\"Asia supplier advantage\">\n<div class=\"wrap\">\n<div class=\"head\">\n<div class=\"eyebrow\">Why an India-based operations team works<\u002Fdiv>\n<h2 class=\"h2\">Asia supplier hours. US-ready updates.<\u002Fh2>\n<p class=\"body\">Your assistant can follow up with suppliers during Asian business hours, keep purchase orders and shipment trackers current, and prepare a clear status, discrepancy, and next-action log for your US team.<\u002Fp>\n<\u002Fdiv>\n<div class=\"grid3 mt40\">\n<div class=\"card\"><h3 class=\"h3\">Reach suppliers while they are working<\u002Fh3><p class=\"body\">Follow up on production, samples, documents, freight, and delayed orders during Asian business hours.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3 class=\"h3\">Structured operations capacity<\u002Fh3><p class=\"body\">Add consistent Excel, ERP, reconciliation, PO, and documentation support without building another local operations role.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3 class=\"h3\">Import operations experience<\u002Fh3><p class=\"body\">Indibuying understands physical products, overseas suppliers, quality documents, purchase orders, shipment milestones, and the follow-through importers require.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 5. Who this is for ────────────────────────── -->\n<section class=\"sec\" id=\"fit\" data-screen-label=\"Who this is for\">\n<div class=\"wrap\"><div class=\"grid2\" style=\"gap:64px;align-items:start\">\n<div class=\"stack g14\">\n<div class=\"eyebrow\">Who this is for<\u002Fdiv>\n<h2 class=\"h2\">Built for businesses with recurring import operations.<\u002Fh2>\n<p class=\"body\">This service works best when inventory and procurement work is recurring, measurable, and important enough that errors or delays cost money.<\u002Fp>\n<div class=\"card\" style=\"margin-top:8px;background:var(--paper-warm);gap:6px\">\n<div class=\"h4\">Common examples:<\u002Fdiv>\n<p class=\"body\">B2B wholesalers and distributors, ecommerce brands with wholesale operations, home and lifestyle importers, hospitality suppliers, packaging businesses, furniture and furnishing companies, and manufacturing or assembly businesses.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"stack g16\">\n<div class=\"h4\">Good fit if the business:<\u002Fdiv>\n<ul class=\"blist\">\n<li>Imports physical products from Asia<\u002Fli>\n<li>Places purchase orders every week or month<\u002Fli>\n<li>Holds inventory in a warehouse or 3PL<\u002Fli>\n<li>Uses an ERP, ecommerce platform, or spreadsheets<\u002Fli>\n<li>Regularly handles receivers, invoices, packing lists, and shipment records<\u002Fli>\n<li>Needs 40 to 160 hours of repeatable operations support each month<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 6. VA vs generic VA ───────────────────────── -->\n<section class=\"sec warm\" data-screen-label=\"VA vs generic VA\">\n<div class=\"wrap\">\n<div class=\"head\">\n<div class=\"eyebrow\">Not a generic VA<\u002Fdiv>\n<h2 class=\"h2\">Inventory &amp; Procurement VA vs generic VA<\u002Fh2>\n<p class=\"body\">A generic VA can help with inbox, calendar, research, and admin.<\u002Fp>\n<p class=\"body\">An Indibuying Inventory &amp; Procurement VA is trained for the work behind physical products:<\u002Fp>\n<\u002Fdiv>\n<ul class=\"chips mt32\">\n<li>Stock count checks<\u002Fli><li>Inventory reconciliation<\u002Fli><li>PO preparation and tracking<\u002Fli><li>Receiver and invoice matching<\u002Fli><li>Customer billing checks<\u002Fli><li>ERP updates<\u002Fli><li>Reorder planning support<\u002Fli><li>Supplier follow-up<\u002Fli><li>Shipment milestone tracking<\u002Fli><li>Discrepancy logs<\u002Fli><li>Excel and Google Sheets work<\u002Fli><li>ChatGPT and LLM use for summaries, SOPs, email drafts, data cleanup, and simple automations<\u002Fli>\n<\u002Ful>\n<div class=\"pull mt40\">\n<div class=\"neg\">The output is not “I followed up.”<\u002Fdiv>\n<div class=\"pos\">The output is: <em>what was checked, what was wrong, what amount or quantity is affected, and what needs to happen next.<\u002Fem><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"body mt32\" style=\"max-width:860px\">The assistant works within agreed SOPs, workflows, and approval limits. Your team retains final control over purchasing, payments, pricing, supplier terms, negotiation, and other commercial decisions.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 7. $99 trial ──────────────────────────────── -->\n<section class=\"sec\" id=\"trial\" data-screen-label=\"Trial\">\n<div class=\"wrap\">\n<div class=\"grid2\" style=\"gap:56px;align-items:start\">\n<div class=\"stack g16\">\n<div class=\"eyebrow\">Start with one workflow<\u002Fdiv>\n<h2 class=\"h2\">$99 Inventory &amp; Procurement Workflow Trial<\u002Fh2>\n<p class=\"body\">Send us one repeatable workflow with a limited document set, spreadsheet export, or system report. We run the workflow once, document what we checked, flag discrepancies, and show you the output format we would maintain every week.<\u002Fp>\n<p class=\"small\"><strong>One workflow. Clear output. No long-term commitment. Full ERP access is not required for the trial.<\u002Fstrong><\u002Fp>\n<div class=\"ctas\" style=\"margin-top:8px\"><a class=\"pill green\" href=\"#pricing\">Start the $99 trial<\u002Fa><a class=\"pill outline\" href=\"#call\">Book a call<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cardf t-green\" style=\"padding:32px\">\n<div class=\"h4\" style=\"color:inherit\">Trial includes:<\u002Fdiv>\n<ul class=\"blist tight\" style=\"margin-top:6px\">\n<li>One clearly defined inventory or procurement workflow<\u002Fli>\n<li>An agreed sample or data range<\u002Fli>\n<li>Completed operational output<\u002Fli>\n<li>Discrepancy and next-action log<\u002Fli>\n<li>A short review and handover call<\u002Fli>\n<li>NDA available if required<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card mt32\" style=\"padding:28px 32px;border-radius:var(--r-feature);gap:14px\">\n<div class=\"h4\">Trial examples:<\u002Fdiv>\n<ul class=\"blist tight cols2\">\n<li>Audit recent POs against vendor invoices and receivers<\u002Fli>\n<li>Reconcile selected SKUs against system inventory<\u002Fli>\n<li>Track open POs and late supplier updates<\u002Fli>\n<li>Clean vendor or product records<\u002Fli>\n<li>Review shortages, overages, slow movers, or phantom stock<\u002Fli>\n<li>Set up a simple weekly inventory or procurement tracker<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 8. Pricing ────────────────────────────────── -->\n<section class=\"sec warm\" id=\"pricing\" data-screen-label=\"Pricing\">\n<div class=\"wrap\">\n<div class=\"head\">\n<div class=\"eyebrow\">Pricing<\u002Fdiv>\n<h2 class=\"h2\">Inventory &amp; Procurement VA<\u002Fh2>\n<p class=\"body\">Start small. Continue monthly when it works.<\u002Fp>\n<\u002Fdiv>\n<div class=\"grid4 mt40\">\n<div class=\"price inkcard\">\n<div class=\"tier\">One-Time Trial<\u002Fdiv>\n<div class=\"amt\">$99<\u002Fdiv>\n<div class=\"hrs\">One workflow, clear output, no long-term commitment.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"price feat\">\n<div class=\"tier\">Starter<\u002Fdiv>\n<div class=\"amt\">$499<span class=\"per\">/month<\u002Fspan><\u002Fdiv>\n<div class=\"hrs\">40 hours/month<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"price\">\n<div class=\"tier\">Part-Time<\u002Fdiv>\n<div class=\"amt\">$899<span class=\"per\">/month<\u002Fspan><\u002Fdiv>\n<div class=\"hrs\">80 hours/month<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"price\">\n<div class=\"tier\">Full-Time<\u002Fdiv>\n<div class=\"amt\">$1,599<span class=\"per\">/month<\u002Fspan><\u002Fdiv>\n<div class=\"hrs\">160 hours/month<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"small mt32\">Monthly plans include a dedicated assistant, Indibuying oversight, documented output, and replacement support if needed.<\u002Fp>\n<div class=\"ctas mt32\"><a class=\"pill green\" href=\"#call\">Start with $99 trial<\u002Fa><a class=\"pill outline\" href=\"#call\">Book a call<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 9. Risk reduction and continuity ──────────── -->\n<section class=\"sec\" data-screen-label=\"Risk reduction\">\n<div class=\"wrap\"><div class=\"grid2\" style=\"gap:56px;align-items:start\">\n<div class=\"stack g16\">\n<div class=\"eyebrow\">How we reduce risk<\u002Fdiv>\n<h2 class=\"h2\">You are not hiring a random freelancer.<\u002Fh2>\n<p class=\"body\">With Indibuying, you get a dedicated assistant backed by a small operations team that understands physical products, suppliers, documents, inventory systems, and weekly process work.<\u002Fp>\n<\u002Fdiv>\n<div class=\"stack g16\">\n<div class=\"h4\">What you get:<\u002Fdiv>\n<ul class=\"blist\">\n<li>Dedicated assistant for your recurring workflow<\u002Fli>\n<li>Manager oversight during onboarding<\u002Fli>\n<li>Output log for completed work<\u002Fli>\n<li>Discrepancies flagged with quantity, value, document reference, and next action<\u002Fli>\n<li>Handover notes maintained<\u002Fli>\n<li>Replacement support if the assistant is unavailable or not the right fit<\u002Fli>\n<li>Ability to grow from trial to starter, part-time, or full-time support<\u002Fli>\n<li>NDA and confidentiality process available<\u002Fli>\n<li>Client-controlled and limited-access accounts preferred<\u002Fli>\n<li>No purchasing or payment authority unless expressly approved<\u002Fli>\n<li>Access can begin with exports and shared files before ERP access is provided<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 10. Assistant evaluation ──────────────────── -->\n<section class=\"sec warm\" data-screen-label=\"Assistant evaluation\">\n<div class=\"wrap\"><div class=\"grid2\" style=\"gap:56px;align-items:start\">\n<div class=\"stack g14\">\n<div class=\"eyebrow\">How assistants are checked<\u002Fdiv>\n<h2 class=\"h2\">Every assistant is evaluated for:<\u002Fh2>\n<\u002Fdiv>\n<div class=\"card\" style=\"padding:32px;border-radius:var(--r-feature)\">\n<ul class=\"blist tight\">\n<li>Inventory and procurement understanding<\u002Fli>\n<li>Excel and Google Sheets accuracy<\u002Fli>\n<li>PO, invoice, receiver, and packing list checking<\u002Fli>\n<li>ERP comfort across tools like Zoho, Shopify, ApparelMagic, Katana, Amazon, and similar systems<\u002Fli>\n<li>Written English clarity<\u002Fli>\n<li>SOP discipline<\u002Fli>\n<li>Detail orientation<\u002Fli>\n<li>Follow-up consistency<\u002Fli>\n<li>Supplier follow-up and exception escalation<\u002Fli>\n<li>Ability to explain discrepancies clearly<\u002Fli>\n<li>Comfort with ChatGPT, LLMs, and simple automations<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 11. Testimonials ──────────────────────────── -->\n<section class=\"sec\" data-screen-label=\"Testimonials\">\n<div class=\"wrap\">\n<div class=\"head\"><div class=\"eyebrow\">Testimonials<\u002Fdiv><h2 class=\"h2\">What clients say<\u002Fh2><p class=\"small\">Placeholders. To be replaced with real Upwork testimonials, client names, and permitted attribution.<\u002Fp><\u002Fdiv>\n<div class=\"grid3 mt40\">\n<div class=\"quote\"><span class=\"plch\">Placeholder<\u002Fspan><blockquote>“[Upwork testimonial about long-term operations, sourcing, or logistics suppor pic\"><image-slot id=\"team-deeksha\" shape=\"circle\"><\u002Fimage-slot><\u002Fdiv>\n<div><div class=\"nm\">Deeksha<\u002Fdiv><div class=\"cred\">[X years relevant experience] · [systems used] · [supplier markets]<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 13. FAQ ───────────────────────────────────── -->\n<section class=\"sec\" id=\"faq\" data-screen-label=\"FAQ\">\n<div class=\"wrap mid\">\n<div class=\"head\" style=\"margin-bottom:32px\"><div class=\"eyebrow\">FAQ<\u002Fdiv><h2 class=\"h2\">Questions buyers ask first<\u002Fh2><\u002Fdiv>\n<div class=\"faq\">\n<details open=\"\"><summary>Do I need SOPs ready?<\u002Fsummary><div class=\"ans\"><p class=\"body\">No. If you have SOPs, we follow them. If not, we start with your current process and help turn it into a simple repeatable workflow.<\u002Fp><\u002Fdiv><\u002Fdetails>\n<details><summary>Which systems can you work with?<\u002Fsummary><div class=\"ans\"><p class=\"body\">We can work with inventory systems, ERPs, ecommerce platforms, spreadsheets, and shared folders. Common examples include Zoho Inventory, Shopify, Amazon, ApparelMagic, Katana, Excel, and Google Sheets.<\u002Fp><\u002Fdiv><\u002Fdetails>\n<details><summary>Is the assistant dedicated?<\u002Fsummary><div class=\"ans\"><p class=\"body\">Yes. Monthly plans include a dedicated assistant assigned to your workflow.<\u002Fp><\u002Fdiv><\u002Fdetails>\n<details><summary>What if the assistant is not a fit?<\u002Fsummary><div class=\"ans\"><p class=\"body\">Indibuying provides oversight and replacement support. We also maintain handover notes so the work does not depend on one person’s memory.<\u002Fp><\u002Fdiv><\u002Fdetails>\n<details><summary>Can you work with suppliers outside India?<\u002Fsummary><div class=\"ans\"><p class=\"body\">Yes. The service is built for import-led businesses working with overseas suppliers, including India, China, Southeast Asia, and other regions.<\u002Fp><\u002Fdiv><\u002Fdetails>\n<details><summary>How do I know the work is being done?<\u002Fsummary><div class=\"ans\"><p class=\"body\">You receive a clear output log. For discrepancies, we document what was checked, what was found, the quantity or value involved, and the suggested next action.<\u002Fp><\u002Fdiv><\u002Fdetails>\n<details><summary>How do you handle confidential information?<\u002Fsummary><div class=\"ans\"><p class=\"body\">We can sign an NDA, work through client-controlled accounts, and use only the access required for the agreed workflow. The $99 trial can usually begin with exports or shared documents instead of full system access.<\u002Fp><\u002Fdiv><\u002Fdetails>\n<details><summary>Can the assistant approve purchases or payments?<\u002Fsummary><div class=\"ans\"><p class=\"body\">Not by default. The assistant can prepare purchase orders, verify documents, update records, and flag required actions. Final purchasing, payment, and commercial approvals remain with your authorised team members.<\u002Fp><\u002Fdiv><\u002Fdetails>\n<details><summary>What happens after the $99 trial?<\u002Fsummary><div class=\"ans\"><p class=\"body\">If the workflow is a fit, you can continue with Starter, Part-Time, or Full-Time monthly support.<\u002Fp><\u002Fdiv><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── 14. Final CTA ─────────────────────────────── -->\n<section class=\"sec tight\" id=\"call\" data-screen-label=\"Final CTA\">\n<div class=\"wrap\"><div class=\"banner\">\n<h2 class=\"h2\">Give us one recurring inventory or procurement workflow.<\u002Fh2>\n<p class=\"sub\">We will run it once, document the output, and show you whether an Indibuying assistant can take it off your team’s plate every week.<\u002Fp>\n<div class=\"ctas\" style=\"margin-top:10px\"><a class=\"pill ondark\" href=\"#trial\">Start the $99 trial<\u002Fa><a class=\"pill\" style=\"background:transparent;border-color:rgba(255,255,255,.35);color:#fff\" href=\"#call\">Book a 20-minute call<\u002F
