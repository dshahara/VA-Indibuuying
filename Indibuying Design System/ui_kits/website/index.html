<!doctype html>
<!-- @dsCard group="UI Kit — Website" name="UI kit / Website" subtitle="Marketing site: hero, how it works, categories, proof, multi-step quote" viewport="1280x900" -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Indibuying — Source from India, without sourcing in India</title>
  <link rel="icon" href="../../assets/logo-mark.png" />
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <div id="root" data-screen-label="Indibuying Website"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="TopNav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="HowItWorks.jsx"></script>
  <script type="text/babel" src="Categories.jsx"></script>
  <script type="text/babel" src="Proof.jsx"></script>
  <script type="text/babel" src="QuoteForm.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    function App() {
      const goQuote = () => {
        const el = document.getElementById('quote');
        if (el) window.scrollTo({ top: el.offsetTop - 64, behavior: 'smooth' });
      };
      return (
        <>
          <TopNav onQuote={goQuote} />
          <Hero onQuote={goQuote} />
          <Metrics />
          <HowItWorks />
          <Categories />
          <Proof />
          <QuoteForm />
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
