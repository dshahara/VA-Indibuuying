<!doctype html>
<!-- @dsCard group="Brand" name="Brand / Don'ts" subtitle="Patterns the brand actively avoids" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Brand — Don'ts</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow" style="color:var(--danger);">Don'ts</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;">
    <div style="background:linear-gradient(135deg,#7c5cff,#3aa1ff);border-radius:var(--r-md);height:80px;display:grid;place-items:center;color:#fff;font:700 12px var(--font-ui);text-align:center;padding:8px;">Bluish-purple<br>gradient</div>
    <div style="background:#fff;border:1px solid var(--border);border-left:4px solid var(--brand-green);border-radius:var(--r-md);height:80px;display:grid;place-items:center;color:var(--fg-1);font:700 12px var(--font-ui);text-align:center;padding:8px;">Left-border-only<br>accent card</div>
    <div style="background:#000;border-radius:var(--r-md);height:80px;display:grid;place-items:center;color:#fff;font:900 italic 18px var(--font-display);">UPPER BODY</div>
    <div style="background:var(--brand-green);border-radius:var(--r-md);height:80px;display:grid;place-items:center;color:#fff;font:900 italic 20px var(--font-display);">😀 🎉 ✨</div>
  </div>
  <div class="note"><strong>Avoid:</strong> bluish-purple gradients · cards with colored left-border-only stripes · pure black or ALL CAPS body · emoji in product UI · stock-y "global ecosystem" imagery · springy animations · glassmorphism.</div>
</div></body></html>
