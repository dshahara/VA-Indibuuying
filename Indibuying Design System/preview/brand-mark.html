<!doctype html>
<!-- @dsCard group="Brand" name="Brand / Bag mark" subtitle="Mark-only treatment and minimum sizes" viewport="700x160" -->
<html><head><meta charset="utf-8"><title>Brand — Bag mark</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Brand · bag mark</div>
  <div style="display:flex;gap:14px;align-items:center;">
    <div style="background:#fff;border:1px solid var(--border);border-radius:var(--r-md);width:96px;height:96px;display:grid;place-items:center;"><img src="../assets/logo-mark.png" style="height:72px;"></div>
    <div style="background:var(--paper-warm);border:1px solid var(--border);border-radius:var(--r-md);width:72px;height:72px;display:grid;place-items:center;"><img src="../assets/logo-mark.png" style="height:52px;"></div>
    <div style="background:var(--brand-green-50);border-radius:var(--r-md);width:56px;height:56px;display:grid;place-items:center;"><img src="../assets/logo-mark.png" style="height:40px;"></div>
    <div style="background:var(--ink-900);border-radius:var(--r-md);width:48px;height:48px;display:grid;place-items:center;"><img src="../assets/logo-mark.png" style="height:32px;filter:brightness(1.1);"></div>
    <div style="background:var(--brand-green);border-radius:var(--r-md);width:40px;height:40px;display:grid;place-items:center;"><img src="../assets/logo-mark.png" style="height:28px;filter:brightness(0) invert(1);"></div>
    <div style="flex:1;">
      <div class="p-small" style="color:var(--fg-1);">The bag-only mark works at <strong>40–96px</strong> for app icons, favicons, social avatars, and as a section glyph. Below 24px, drop the inset "Indibuying" wordmark inside the bag — it becomes illegible.</div>
    </div>
  </div>
</div></body></html>
