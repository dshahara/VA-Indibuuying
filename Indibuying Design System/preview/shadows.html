<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing / Shadows & rings" subtitle="Two-step elevation + focus ring set" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Shadows & Rings</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:var(--paper-warm);">
  <div class="eyebrow">Elevation · shadows &amp; focus rings</div>
  <div class="row" style="gap:20px;">
    <div class="swatch">
      <div style="height:72px;background:#fff;border-radius:var(--r-md);border:1px solid var(--border);box-shadow:var(--shadow-1);"></div>
      <div class="name">Shadow 1</div><div class="hex">resting</div>
    </div>
    <div class="swatch">
      <div style="height:72px;background:#fff;border-radius:var(--r-md);border:1px solid var(--border);box-shadow:var(--shadow-2);"></div>
      <div class="name">Shadow 2</div><div class="hex">hover · sticky</div>
    </div>
    <div class="swatch">
      <div style="height:72px;background:#fff;border-radius:var(--r-md);border:1px solid var(--border);box-shadow:var(--shadow-3);"></div>
      <div class="name">Shadow 3</div><div class="hex">dialog · popover</div>
    </div>
    <div class="swatch">
      <div style="height:72px;background:var(--brand-green);border-radius:var(--r-md);box-shadow:var(--ring-brand);"></div>
      <div class="name">Ring · brand</div><div class="hex">primary focus</div>
    </div>
    <div class="swatch">
      <div style="height:72px;background:#fff;border-radius:var(--r-md);border:1px solid var(--border);box-shadow:var(--ring-focus);"></div>
      <div class="name">Ring · focus</div><div class="hex">neutral focus</div>
    </div>
  </div>
</div></body></html>
