<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing / Radii" subtitle="xs → 2xl + pill" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Corner radii</div>
  <div class="row" style="gap:18px;">
    <div class="swatch"><div style="height:64px;border:1.5px solid var(--ink-900);border-radius:var(--r-xs);background:var(--brand-green-50);"></div><div class="name">xs</div><div class="hex">4</div></div>
    <div class="swatch"><div style="height:64px;border:1.5px solid var(--ink-900);border-radius:var(--r-sm);background:var(--brand-green-50);"></div><div class="name">sm</div><div class="hex">6</div></div>
    <div class="swatch"><div style="height:64px;border:1.5px solid var(--ink-900);border-radius:var(--r-md);background:var(--brand-green-50);"></div><div class="name">md · default</div><div class="hex">10</div></div>
    <div class="swatch"><div style="height:64px;border:1.5px solid var(--ink-900);border-radius:var(--r-lg);background:var(--brand-green-50);"></div><div class="name">lg</div><div class="hex">14</div></div>
    <div class="swatch"><div style="height:64px;border:1.5px solid var(--ink-900);border-radius:var(--r-xl);background:var(--brand-green-50);"></div><div class="name">xl</div><div class="hex">20</div></div>
    <div class="swatch"><div style="height:64px;border:1.5px solid var(--ink-900);border-radius:var(--r-2xl);background:var(--brand-green-50);"></div><div class="name">2xl</div><div class="hex">28</div></div>
    <div class="swatch"><div style="height:64px;border:1.5px solid var(--ink-900);border-radius:var(--r-pill);background:var(--brand-green-50);"></div><div class="name">pill</div><div class="hex">∞</div></div>
  </div>
</div></body></html>
