<!doctype html>
<!-- @dsCard group="Colors" name="Colors / Semantic" subtitle="Success / warning / danger / info" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Colors — Semantic</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Semantic · states</div>
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:var(--success);display:grid;place-items:center;color:#fff;font:600 11px var(--font-ui);">Shipped</div>
      <div class="name">Success</div><div class="hex">#1EAF12 · = brand</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--warning);display:grid;place-items:center;color:#fff;font:600 11px var(--font-ui);">In review</div>
      <div class="name">Warning</div><div class="hex">#E8A317</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--danger);display:grid;place-items:center;color:#fff;font:600 11px var(--font-ui);">Delayed</div>
      <div class="name">Danger</div><div class="hex">#D8443C</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:var(--info);display:grid;place-items:center;color:#fff;font:600 11px var(--font-ui);">Pending</div>
      <div class="name">Info</div><div class="hex">#1F7AD8</div>
    </div>
  </div>
</div></body></html>
