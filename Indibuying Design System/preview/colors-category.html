<!doctype html>
<!-- @dsCard group="Colors" name="Colors / Category tints" subtitle="One pastel per sourcing category, with its ink" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Colors — Category tints</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Category tints</div>
  <div class="row" style="gap:12px;align-items:stretch;">
    <div class="swatch"><div class="chip" style="background:var(--cat-jewellery);border-color:transparent;display:grid;place-items:center;"><span style="font:700 15px var(--font-display);color:var(--cat-jewellery-ink);">Aa</span></div><div class="name">Jewellery</div><div class="hex">#FDEBD6 · #7A4410</div></div>
    <div class="swatch"><div class="chip" style="background:var(--cat-handicrafts);border-color:transparent;display:grid;place-items:center;"><span style="font:700 15px var(--font-display);color:var(--cat-handicrafts-ink);">Aa</span></div><div class="name">Handicrafts</div><div class="hex">#F5E3DB · #74392A</div></div>
    <div class="swatch"><div class="chip" style="background:var(--cat-furniture);border-color:transparent;display:grid;place-items:center;"><span style="font:700 15px var(--font-display);color:var(--cat-furniture-ink);">Aa</span></div><div class="name">Furniture</div><div class="hex">#E3E9F2 · #1F3A5F</div></div>
    <div class="swatch"><div class="chip" style="background:var(--cat-furnishings);border-color:transparent;display:grid;place-items:center;"><span style="font:700 15px var(--font-display);color:var(--cat-furnishings-ink);">Aa</span></div><div class="name">Furnishings</div><div class="hex">#DCEFE9 · #1C5A4C</div></div>
    <div class="swatch"><div class="chip" style="background:var(--cat-apparel);border-color:transparent;display:grid;place-items:center;"><span style="font:700 15px var(--font-display);color:var(--cat-apparel-ink);">Aa</span></div><div class="name">Apparel</div><div class="hex">#F7E2E4 · #7A2F36</div></div>
  </div>
  <div class="note">Pastel fills carry the sourcing catalogue. Tag and card always use the same pair — fill plus its ink.</div>
</div></body></html>
