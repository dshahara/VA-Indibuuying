<!doctype html>
<!-- @dsCard group="Colors" name="Colors / Surfaces" subtitle="Paper, warm paper, sunken and borders" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Colors — Surfaces</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="eyebrow">Surfaces · backgrounds</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:var(--paper);border:1px solid var(--border)"></div><div class="name">Paper</div><div class="hex">#FFFFFF · --bg</div></div>
    <div class="swatch"><div class="chip" style="background:var(--paper-warm);border:1px solid var(--border)"></div><div class="name">Paper warm</div><div class="hex">#FBFBF7 · --bg-alt</div></div>
    <div class="swatch"><div class="chip" style="background:var(--bg-sunken);border:1px solid var(--border)"></div><div class="name">Sunken</div><div class="hex">#F6F8F6 · --bg-sunken</div></div>
    <div class="swatch"><div class="chip" style="background:var(--surface-2);border:1px solid var(--border)"></div><div class="name">Surface 2</div><div class="hex">#F6F8F6</div></div>
    <div class="swatch"><div class="chip" style="background:#fff;border:1px solid var(--border)"></div><div class="name">Border</div><div class="hex">#E2E7E4 · --border</div></div>
    <div class="swatch"><div class="chip" style="background:#fff;border:1px solid var(--border-strong)"></div><div class="name">Border strong</div><div class="hex">#C4CCC6</div></div>
  </div>
</div></body></html>
