<!doctype html>
<html><head><meta charset="utf-8"><title>Indibuying</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:854px;overflow:hidden}
.tile{display:flex;width:1280px;height:854px}
.main{flex:1;background:var(--brand-green);display:grid;place-items:center;padding:0 48px}
.main span{font-family:var(--font-display);font-weight:900;font-style:italic;font-size:170px;line-height:1;letter-spacing:-.03em;color:#fff;white-space:nowrap}
.strip{width:320px;display:flex;flex-direction:column}
.strip i{flex:1;display:block}
</style></head>
<body><div class="tile">
<div class="main"><span>Indibuying</span></div>
<div class="strip">
<i style="background:#E8A317"></i>
<i style="background:#F2913B"></i>
<i style="background:#D8443C"></i>
<i style="background:#1F3A5F"></i>
</div>
</div></body></html>
