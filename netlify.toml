[build]
  command = "npm run build:va"
  publish = "va-site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/contact/"
  to = "/contact-us/"
  status = 301

[[redirects]]
  from = "/home/"
  to = "/"
  status = 301
